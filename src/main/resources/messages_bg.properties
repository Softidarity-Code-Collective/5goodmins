# --- Daily digest email (ADR-005) --------------------------------------------
# The flagship email, and the only one of the four with an unsubscribe link.
#
# The subject takes {0}, the number of new actions, and that is not decoration:
# this email goes to the same address every morning, and Gmail, Outlook and
# Apple Mail all thread consecutive messages that share a subject -- so a
# constant subject collapses a month of digests into one conversation with
# yesterday's still unread. EmailComposer's five-argument overload exists for
# this one key.
#
# MessageFormat rules apply, so a literal single quote would have to be
# doubled; none of these sentences uses an apostrophe.
#
# THE COUNT IS A choice, NOT A PLAIN {0}, in both the subject and the intro.
# Written as "{0} нови действия" a one-action digest reads "1 нови действия",
# and one action is the commonest digest this site will ever send. Bulgarian
# needs more than the noun switched: the relative clause and its verb agree too
# ("1 ново действие, което отговаря" against "3 нови действия, които
# отговарят"), which is why the choice spans the clause rather than just the
# number. The zero branch is deliberately absent -- DigestService sends no email
# at all for an empty digest, so it is unreachable copy.
email.digest.subject={0,choice,1#1 ново действие|1<{0} нови действия} за вас
email.digest.preheader=Ето какво е ново от последния ви бюлетин.
email.digest.greeting=Здравейте, {0},
email.digest.intro=От последния ви бюлетин има {0,choice,1#1 ново действие, което отговаря|1<{0} нови действия, които отговарят} на избраните от вас теми и райони.
email.digest.cta=Вижте всички действия
# The unsubscribe line, in two keys because the second is the link text and a
# sentence with a link at the end needs the halves separately. Legally
# required (ADR-005) -- these two lines are not optional copy.
email.digest.unsubscribe.before=Не искате този имейл?
email.digest.unsubscribe.link=Отпишете се

