# --- Taxonomy: the display text for every enum constant (ADR-008) -----------
# The constants are English identifiers in the code and in the database
# (ActionType, Category, Region, ActionStatus); these lines are the only place
# a human-readable form of them exists. A template renders one with
# #{'category.' + ${category}} -- the key is built from the enum name, which
# is why the segment after the dot is UPPER_SNAKE here and camelCase nowhere.
#
# TaxonomyMessagesTest walks the four enums and fails if a constant has no key
# in either bundle. That matters more than it looks: with locale fallback off
# (MessageSourceConfig), a missing key is a NoSuchMessageException, so a new
# region added without a label is a 500 on every page that lists regions.

