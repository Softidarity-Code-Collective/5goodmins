# 429 is reached by a POST rather than a link: ADR-002's limiter refuses the
# login and registration forms through the error dispatch. It names no
# interval, which is a security decision -- the reasoning is in ADR-002.
#
# "Направихте" is the active voice and it is a deliberate choice with a known
# cost, not an oversight. The bucket is keyed on the client address, never on
# a person, and ADR-002 sizes the login limit for carrier-grade NAT precisely
# because one address can be a whole network -- so a reader refused for a
# stranger's attempts is told they made them. An agentless passive
# ("Регистрирани са твърде много опити") is accurate for every reader and
# was rejected as the colder sentence. If this page ever draws complaints
# from innocent users, this line is the first thing to revisit.
